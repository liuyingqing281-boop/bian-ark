<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>彼岸 · 纪念馆首页</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="shared/ui.css"/>
</head>
<body>
<div class="screen">
  <!-- 状态栏 -->
  <div class="statusbar">
    <span>21:47</span>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>

  <!-- 应用导航栏 -->
  <div class="navbar">
    <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="title">纪念馆</span>
    <button class="nav-btn"><i class="fa-solid fa-ellipsis"></i></button>
  </div>

  <div class="scroll">
    <!-- 顶部沉浸区 -->
    <section class="pad flex flex-col items-center text-center pt-3 pb-7 relative">
      <div class="relative">
        <img src="assets/portrait.png" alt="TA 的照片"
             class="w-28 h-28 rounded-full object-cover"
             style="box-shadow:0 0 40px rgba(255,122,47,.5),0 0 90px rgba(244,93,18,.3)"/>
        <span class="absolute -bottom-1 -right-1 w-8 h-8 rounded-full card flex items-center justify-center text-xs"><span class="flame" style="width:8px;height:12px"></span></span>
      </div>
      <h1 class="display text-3xl mt-5 tracking-widest">林守拙</h1>
      <p class="t3 text-sm mt-1 tracking-[0.3em]">1940 — 2023</p>
      <p class="t2 text-[13px] mt-3">“想念从未离开”</p>
      <button class="btn-primary mt-6"><i class="fa-solid fa-comment-dots"></i>和 TA 说说话</button>
      <p class="t3 text-[11px] mt-3 flex items-center gap-1.5"><span class="flame" style="width:7px;height:11px"></span>你点的灯还亮着 · 已持续 3 小时</p>
    </section>

    <!-- 三等宽锚点 Tab -->
    <div class="grid grid-cols-3 border-y border-white/10 sticky top-0 z-10" style="background:rgba(7,3,2,.8);backdrop-filter:blur(14px)">
      <button class="h-12 text-[15px] relative" style="color:var(--ember-soft)">记忆<span class="absolute inset-x-12 bottom-1.5 h-0.5 rounded" style="background:var(--ember)"></span></button>
      <button class="h-12 text-[15px] t2">想念</button>
      <button class="h-12 text-[15px] t2">祭奠</button>
    </div>

    <!-- 记忆 · TA 的人生 -->
    <section class="pad pt-6">
      <div class="flex items-center justify-between">
        <h2 class="display text-lg tracking-wider">TA 的人生</h2>
        <button class="chip text-xs"><i class="fa-solid fa-plus mr-1"></i>添加</button>
      </div>
      <div class="card mt-3 p-5">
        <div class="space-y-4">
          <div class="flex items-baseline gap-4"><span class="display w-12 text-[15px]" style="color:var(--ember-soft)">1940</span><span class="text-[15px]">出生</span></div>
          <div class="flex items-baseline gap-4"><span class="display w-12 text-[15px]" style="color:var(--ember-soft)">1965</span><span class="text-[15px]">结婚</span></div>
          <div class="flex items-baseline gap-4"><span class="display w-12 text-[15px]" style="color:var(--ember-soft)">1970</span><span class="text-[15px]">长子出生</span></div>
          <div class="flex items-baseline gap-4"><span class="display w-12 text-[15px]" style="color:var(--ember-soft)">1998</span><span class="text-[15px]">退休</span></div>
        </div>
      </div>
      <div class="card mt-3 overflow-hidden">
        <img src="assets/sea.png" alt="第一次一起旅行" class="w-full h-32 object-cover opacity-90"/>
        <p class="px-5 py-3 text-[13px] t2">1978 · 第一次一起旅行，去青岛看海</p>
      </div>
    </section>

    <!-- 想念 · 最近的纪念 -->
    <section class="pad pt-7">
      <h2 class="display text-lg tracking-wider">最近的纪念</h2>
      <div class="card mt-3 divide-y divide-white/5">
        <div class="flex items-center gap-3 px-4 py-3.5">
          <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm" style="background:rgba(255,122,47,.14);color:var(--ember-soft)"><i class="fa-solid fa-seedling"></i></span>
          <span class="flex-1 text-[14px]">献花 · 李**</span><span class="t3 text-xs">2 小时前</span>
        </div>
        <div class="flex items-center gap-3 px-4 py-3.5">
          <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm" style="background:rgba(255,122,47,.14);color:var(--ember-soft)"><i class="fa-solid fa-comment"></i></span>
          <span class="flex-1 text-[14px]">留言 · 用户A</span><span class="t3 text-xs">昨天</span>
        </div>
        <div class="flex items-center gap-3 px-4 py-3.5">
          <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm" style="background:rgba(255,122,47,.14);color:var(--ember-soft)"><i class="fa-solid fa-fire"></i></span>
          <span class="flex-1 text-[14px]">点灯 · 王**</span><span class="t3 text-xs">3 天前</span>
        </div>
        <div class="flex items-center gap-3 px-4 py-3.5">
          <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm" style="background:rgba(255,122,47,.14);color:var(--ember-soft)"><i class="fa-solid fa-lock"></i></span>
          <span class="flex-1 text-[14px]">悄悄话 · 我 <i class="fa-solid fa-lock text-[10px] t3 ml-1"></i></span><span class="t3 text-xs">3 天前</span>
        </div>
      </div>
    </section>

    <!-- 祭奠 · 基础三项 -->
    <section class="pad pt-7 pb-8">
      <h2 class="display text-lg tracking-wider">今天想为 TA 做什么？</h2>
      <div class="grid grid-cols-3 gap-3 mt-3">
        <button class="card p-3 flex flex-col items-center gap-2 relative overflow-hidden">
          <span class="absolute top-2 right-2 text-[10px]" style="color:var(--ok)">免费</span>
          <img src="assets/flower.png" class="w-12 h-12 rounded-xl object-cover" alt="献花"/>
          <span class="text-[13px] t2">献花</span>
        </button>
        <button class="card p-3 flex flex-col items-center gap-2 relative overflow-hidden">
          <span class="absolute top-2 right-2 text-[10px]" style="color:var(--ok)">免费</span>
          <img src="assets/candle.png" class="w-12 h-12 rounded-xl object-cover" alt="点灯"/>
          <span class="text-[13px] t2">点灯</span>
        </button>
        <button class="card p-3 flex flex-col items-center gap-2 relative overflow-hidden">
          <span class="absolute top-2 right-2 text-[10px]" style="color:var(--ok)">免费</span>
          <img src="assets/incense.png" class="w-12 h-12 rounded-xl object-cover" alt="清香"/>
          <span class="text-[13px] t2">清香</span>
        </button>
      </div>
      <button class="card w-full mt-3 px-5 py-4 flex items-center justify-between">
        <span class="text-[14px] t2"><i class="fa-solid fa-wand-magic-sparkles mr-2" style="color:var(--ember-soft)"></i>为 TA 准备特别的礼物</span>
        <i class="fa-solid fa-chevron-right t3 text-xs"></i>
      </button>
    </section>
  </div>

  <!-- 底部导航 -->
  <nav class="tabbar">
    <div class="tab active"><i class="fa-solid fa-place-of-worship"></i><span>纪念馆</span></div>
    <div class="tab"><i class="fa-solid fa-compass"></i><span>发现</span></div>
    <div class="tab"><i class="fa-solid fa-user"></i><span>我的</span></div>
  </nav>
</div>
</body>
</html>
