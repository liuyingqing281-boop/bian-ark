<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>彼岸 · 为 TA 准备一份礼物</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="../shared/ui.css"/>
</head>
<body>
<div class="screen">
  <div class="statusbar">
    <span>21:47</span>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>
  <div class="navbar">
    <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="title">为 TA 准备一份礼物</span>
    <span class="w-10"></span>
  </div>

  <div class="scroll pad pt-2 pb-8">
    <!-- 步骤指示 -->
    <div class="flex items-center gap-2 justify-center">
      <span class="chip active text-[11px]">1 心意</span>
      <span class="w-5 h-px bg-white/15"></span>
      <span class="chip active text-[11px]">2 礼物</span>
      <span class="w-5 h-px bg-white/15"></span>
      <span class="chip text-[11px]" style="color:var(--ember-soft);border-color:rgba(255,179,92,.55)">3 完成</span>
    </div>

    <!-- 生成结果 -->
    <div class="card mt-6 overflow-hidden">
      <img src="../assets/keepsake.png" class="w-full h-64 object-cover" alt="一套特别的茶具"/>
      <div class="p-5">
        <h2 class="display text-lg tracking-wider">一套特别的茶具</h2>
        <p class="t2 text-[13px] mt-2 leading-relaxed">“这是我想送给你的。你以前总说，喝茶要慢慢来，不着急。”</p>
        <p class="t3 text-[11px] mt-3"><i class="fa-solid fa-circle-info mr-1"></i>由你记录的 TA 的喜好生成 · 一口价 ¥19</p>
      </div>
    </div>

    <div class="space-y-3 mt-6">
      <button class="btn-primary"><i class="fa-solid fa-box-archive"></i>收藏到纪念馆</button>
      <div class="grid grid-cols-2 gap-3">
        <button class="btn-ghost"><i class="fa-solid fa-share-nodes text-[13px]"></i>分享给亲友</button>
        <button class="btn-ghost"><i class="fa-solid fa-rotate-left text-[13px]"></i>再准备一件</button>
      </div>
    </div>

    <!-- 流程回顾 -->
    <div class="card mt-6 p-4 space-y-3">
      <div class="flex gap-3 text-[13px]"><span class="t3 w-14 shrink-0">TA 喜欢</span><span class="t2">很喜欢喝茶</span></div>
      <div class="flex gap-3 text-[13px]"><span class="t3 w-14 shrink-0">你的心愿</span><span class="t2">想送 TA 一套特别的茶具</span></div>
      <div class="flex gap-3 text-[13px]"><span class="t3 w-14 shrink-0">AI 扩写</span><span class="t2">粗陶质地、暖柚木托盘、壶身刻一缕茶香纹路</span></div>
    </div>
    <p class="t3 text-[11px] text-center mt-4">「帮我写」每日限量 · 生成失败自动退费</p>
  </div>
</div>
<script src="../shared/api.js"></script>
<script>
// 礼物页（P1 实验）：原型演示态——真实「帮我写/帮我准备」链路接 /api/items/prompt|generate|claim，
// 涉及一口价支付与异步生成，演示环境提示链路去向。
(() => {
  const A = window.BianApi;
  document.querySelectorAll(".btn-primary, .btn-ghost").forEach((b) =>
    b.addEventListener("click", () => {
      const t = b.textContent.trim();
      if (t.includes("收藏")) A.toast("演示环境：生成物审核通过后出现在供桌");
      else if (t.includes("分享")) A.toast("演示环境：生成分享卡片");
      else if (t.includes("再准备")) A.toast("回到第 1 步重新填写心意");
    })
  );
})();
</script>
</body>
</html>
