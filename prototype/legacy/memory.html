<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>彼岸 · TA 的记忆档案</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="../shared/ui.css"/>
</head>
<body>
<div class="screen">
  <div class="statusbar">
    <span>21:47</span>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>
  <div class="navbar">
    <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="title">TA 的记忆档案</span>
    <span class="w-10"></span>
  </div>

  <div class="scroll pad pt-1 pb-28" id="mem-body">
    <p class="t2 text-[13px]">已建立 <span style="color:var(--ember-soft)" class="display" id="mem-total">…</span> 条记忆</p>
    <div id="mem-sections"></div>
  </div>

  <!-- 底部固定主按钮 -->
  <div class="absolute inset-x-0 bottom-0 pad pb-7 pt-10" style="background:linear-gradient(to top, var(--bg) 55%, transparent)">
    <button class="btn-primary" id="mem-add"><i class="fa-solid fa-plus"></i>添加记忆</button>
  </div>
</div>
<script src="../shared/api.js"></script>
<script>
(async () => {
  const A = window.BianApi, id = A.memorialId(), q = `?id=${encodeURIComponent(id)}`;
  document.getElementById("mem-add").addEventListener("click", () => (location.href = "memory-add.html" + q));

  const SECTIONS = [
    { key: "personality", icon: "fa-user", name: "TA 是怎样的人", hint: "还不知道怎么描述 TA？" },
    { key: "relation", icon: "fa-heart", name: "我和 TA", hint: "你们的故事值得被记住", star: true },
    { key: "likes", icon: "fa-mug-hot", name: "TA 喜欢什么", hint: "TA 平时喜欢做什么？" },
    { key: "speech", icon: "fa-quote-left", name: "TA 怎么说话", hint: "TA 常挂在嘴边的话是？" },
    { key: "profile", icon: "fa-file-lines", name: "基础资料", hint: "引导填写 TA 的基础资料" },
  ];
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  async function render() {
    const r = await A.getMemories(id);
    if (!r.ok || !r.data) return;
    const d = r.data;
    document.getElementById("mem-total").textContent = d.total ?? 0;
    // entries（带 id，供删除）；无 entries 时由 sections 文本数组兜底
    const entries = Array.isArray(d.entries)
      ? d.entries
      : Object.entries(d.sections || {}).flatMap(([section, arr]) => arr.map((content) => ({ id: "", section, content })));
    document.getElementById("mem-sections").innerHTML = SECTIONS.map((s) => {
      const list = entries.filter((e) => e.section === s.key);
      const body = list.length
        ? `<div class="card mt-2 divide-y divide-white/5">${list
            .map(
              (e) => `<p class="px-4 py-3.5 text-[14px] flex items-start gap-2">
                <span class="flex-1">${esc(e.content)}</span>
                ${e.id ? `<button class="t3 text-[11px] mem-del" data-id="${e.id}">删除</button>` : ""}
              </p>`
            )
            .join("")}</div>`
        : `<p class="t3 text-[13px] mt-2">${s.hint}</p>`;
      return `<section class="mt-6">
        <h2 class="text-[15px] flex items-center gap-2 ${s.star ? "display" : ""}" ${s.star ? 'style="color:var(--ember-soft)"' : ""}>
          <i class="fa-solid ${s.icon} text-[13px]" ${s.star ? "" : 'style="color:var(--ember-soft)"'}></i>${s.name}
          ${s.star ? '<span class="text-[10px] px-2 py-0.5 rounded-full" style="background:rgba(255,122,47,.14)">关系记忆</span>' : ""}
        </h2>${body}</section>`;
    }).join("");
  }
  await render();

  // 删除（二次确认；仅馆主/协作人可成功）
  document.getElementById("mem-sections").addEventListener("click", async (e) => {
    const btn = e.target.closest(".mem-del");
    if (!btn) return;
    if (!confirm("删除这条记忆？此操作不可恢复。")) return;
    const r = await A.deleteMemory(btn.dataset.id);
    if (r.ok) { A.toast("已删除"); render(); }
    else if (r.status === 403) A.toast("只有馆主和协作人可以删除记忆");
    else A.toast("没有删除成功，请再试一次");
  });
})();
</script>
</body>
</html>
