<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>彼岸 · 想念</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="../shared/ui.css"/>
</head>
<body>
<div class="screen">
  <div class="statusbar">
    <span>21:47</span>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>
  <div class="navbar">
    <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="title">想念</span>
    <span class="w-10"></span>
  </div>

  <div class="scroll">
    <section class="pad flex flex-col items-center text-center pt-4">
      <h1 class="display text-2xl tracking-wider">今天想和 TA 说些什么？</h1>
      <img src="../assets/portrait.png" alt="TA 的照片" class="w-20 h-20 rounded-full object-cover mt-5"
           style="box-shadow:0 0 30px rgba(255,122,47,.45)"/>
      <p class="t3 text-[13px] mt-3">“想说的话，可以告诉我。”</p>
      <button class="btn-primary mt-5" style="width:auto;padding:0 40px"><i class="fa-solid fa-comment-dots"></i>和 TA 说说话</button>
    </section>

    <section class="pad pt-8 pb-6">
      <h2 class="display text-lg tracking-wider">留下你的话</h2>
      <div class="card mt-3 p-4">
        <textarea rows="5" id="miss-text" class="w-full bg-transparent outline-none resize-none text-[15px] placeholder:text-[rgba(255,246,236,.35)]"
          style="color:var(--text)" placeholder="写下想对 TA 说的话……"></textarea>
        <div class="flex items-center justify-between mt-1">
          <span class="t3 text-xs">写下想对 TA 说的话……</span>
          <span class="t3 text-xs" id="miss-count">0/500</span>
        </div>
      </div>
      <div class="flex gap-2 mt-3" id="miss-types">
        <button class="chip" data-type="eulogy">悼文</button>
        <button class="chip" data-type="private"><i class="fa-solid fa-lock mr-1 text-[10px]"></i>悄悄话</button>
        <button class="chip active" data-type="public">留言</button>
      </div>
      <p class="t3 text-[11px] mt-2 leading-relaxed">留言公开可见 · 悄悄话仅自己可见 · 悼文将在馆内置顶</p>
      <button class="btn-primary mt-4" id="miss-submit" disabled style="opacity:.5">提 交</button>
    </section>

    <!-- 已留下的 -->
    <section class="pad pb-8">
      <h2 class="display text-lg tracking-wider">你留下的</h2>
      <div id="miss-list">
      </div>
    </section>
  </div>

  <nav class="tabbar">
    <div class="tab active"><i class="fa-solid fa-place-of-worship"></i><span>纪念馆</span></div>
    <div class="tab"><i class="fa-solid fa-compass"></i><span>发现</span></div>
    <div class="tab"><i class="fa-solid fa-user"></i><span>我的</span></div>
  </nav>
</div>
<script src="../shared/api.js"></script>
<script>
(async () => {
  const A = window.BianApi, id = A.memorialId(), q = `?id=${encodeURIComponent(id)}`;
  let msgType = "public";
  const ta = document.getElementById("miss-text");
  const count = document.getElementById("miss-count");
  const submit = document.getElementById("miss-submit");

  // 主 CTA 跳转
  document.querySelector(".btn-primary.mt-5")?.addEventListener("click", () => {
    location.href = (localStorage.getItem("bian_seen_intro") ? "chat.html" : "chat-intro.html") + q;
  });

  // 类型单选
  document.querySelectorAll("#miss-types .chip").forEach((c) =>
    c.addEventListener("click", () => {
      document.querySelectorAll("#miss-types .chip").forEach((x) => x.classList.remove("active"));
      c.classList.add("active");
      msgType = c.dataset.type;
    })
  );

  // 500 字计数 + 空内容置灰
  ta.addEventListener("input", () => {
    if (ta.value.length > 500) ta.value = ta.value.slice(0, 500);
    count.textContent = `${ta.value.length}/500`;
    const empty = !ta.value.trim();
    submit.disabled = empty;
    submit.style.opacity = empty ? ".5" : "1";
  });

  const TYPE_META = { public: ["fa-comment", "留言"], private: ["fa-lock", "悄悄话 · 仅自己可见"], eulogy: ["fa-book-open", "悼文 · 馆内置顶"] };
  async function renderList() {
    const r = await A.getMessages(id);
    const box = document.getElementById("miss-list");
    if (!r.ok || !Array.isArray(r.data?.items) || !r.data.items.length) {
      box.innerHTML = `<p class="t3 text-[13px] mt-3">还没有留下的话，说点什么吧。</p>`;
      return;
    }
    box.innerHTML = r.data.items
      .map((m) => {
        const [icon, label] = TYPE_META[m.msgType || m.msg_type] || TYPE_META.public;
        return `<div class="card mt-3 p-4">
          <div class="flex items-center gap-2 text-[11px] t3"><i class="fa-solid ${icon}"></i>${label} · ${A.relTime(m.createdAt || m.created_at)}</div>
          <p class="text-[14px] mt-2 leading-relaxed">“${m.content}”</p>
        </div>`;
      })
      .join("");
  }
  await renderList();

  submit.addEventListener("click", async () => {
    const content = ta.value.trim();
    if (!content) return;
    const r = await A.postMessage(msgType, content);
    if (r.ok) {
      ta.value = ""; ta.dispatchEvent(new Event("input"));
      A.toast("已留下");
      renderList();
    } else if (r.status === 401) A.toast("登录后才能留下你的话");
    else if (r.status === 422) A.toast("这个话题我们轻轻带过");
    else A.toast("没有提交成功，请再试一次");
  });
})();
</script>
</body>
</html>
