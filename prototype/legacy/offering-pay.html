<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>彼岸 · 一口价确认（弹窗态）</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
<link rel="stylesheet" href="../shared/ui.css"/>
</head>
<body>
<div class="screen">
  <div class="statusbar">
    <span>21:47</span>
    <div class="icons"><i class="fa-solid fa-signal"></i><i class="fa-solid fa-wifi"></i><i class="fa-solid fa-battery-three-quarters"></i></div>
  </div>
  <div class="navbar">
    <button class="nav-btn"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="title">祭奠</span>
    <span class="w-10"></span>
  </div>

  <!-- 背景页（被遮罩） -->
  <div class="scroll pad pt-2 opacity-50">
    <h1 class="display text-2xl tracking-wider text-center">今天想为 TA 做什么？</h1>
    <div class="grid grid-cols-3 gap-3 mt-6">
      <div class="card p-3 flex flex-col items-center gap-2"><img src="../assets/flower.png" class="w-14 h-14 rounded-xl object-cover" alt=""/><span class="text-[13px]">献花</span></div>
      <div class="card p-3 flex flex-col items-center gap-2"><img src="../assets/candle.png" class="w-14 h-14 rounded-xl object-cover" alt=""/><span class="text-[13px]">点灯</span></div>
      <div class="card p-3 flex flex-col items-center gap-2"><img src="../assets/incense.png" class="w-14 h-14 rounded-xl object-cover" alt=""/><span class="text-[13px]">清香</span></div>
    </div>
  </div>

  <!-- 一口价确认弹窗：元素白名单 = 图标+名称+价格+说明+双按钮 -->
  <div class="sheet-mask"></div>
  <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 pad">
    <div class="card p-6 text-center" style="background:#150806;border-radius:26px;box-shadow:0 24px 60px rgba(0,0,0,.6)">
      <img src="../assets/tea.png" class="w-20 h-20 rounded-2xl object-cover mx-auto" alt="敬一杯茶"
           style="box-shadow:0 0 30px rgba(255,122,47,.4)"/>
      <h3 class="display text-xl mt-4 tracking-wider">敬一杯茶</h3>
      <p class="display text-2xl mt-2" style="color:var(--ember-soft)">一口价 ¥6</p>
      <p class="t2 text-[13px] mt-3">会出现在纪念馆的供桌上</p>
      <div class="grid grid-cols-2 gap-3 mt-6">
        <button class="btn-ghost">取 消</button>
        <button class="btn-primary" style="height:52px">供 奉</button>
      </div>
    </div>
  </div>
</div>
<script src="../shared/api.js"></script>
<script>
(async () => {
  const A = window.BianApi;
  const params = new URLSearchParams(location.search);
  const itemId = params.get("item");
  const [cancelBtn, payBtn] = document.querySelectorAll(".grid.grid-cols-2 button");
  cancelBtn.addEventListener("click", () => history.back());

  // 展示真实目录中的名称与一口价（白名单：图标+名称+价格+说明+双按钮）
  let item = null;
  if (itemId) {
    const r = await A.getItems();
    item = (r.data?.items || []).find((x) => x.id === itemId);
    if (item) {
      document.querySelector("h3.display").textContent = item.name;
      document.querySelector("p.display.text-2xl").textContent = `一口价 ${A.yuan(item.priceCents ?? item.price_cents)}`;
    }
  }

  payBtn.addEventListener("click", async () => {
    // 原型演示态：不接真实 Stripe 收银台；直接提示链路去向
    A.toast("演示环境：线上将跳转支付收银台，支付成功后出现在供桌上");
    setTimeout(() => history.back(), 1200);
  });
})();
</script>
</body>
</html>
