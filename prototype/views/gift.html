<!-- V6 礼物页（W5+W6：心愿 → 自动润色确认 → 真实进度生成 → 收藏） -->
<div class="navbar">
  <button class="nav-btn nav-back"><i class="fa-solid fa-chevron-left"></i></button>
  <span class="title">为 TA 准备一份礼物</span>
  <span class="w-10"></span>
</div>

<div class="scroll pad pt-2 pb-8">
  <div class="flex items-center gap-2 justify-center" id="gift-steps">
    <span class="chip active text-[11px]" data-step="1">1 心意</span>
    <span class="w-5 h-px bg-white/15"></span>
    <span class="chip text-[11px]" data-step="2">2 礼物</span>
    <span class="w-5 h-px bg-white/15"></span>
    <span class="chip text-[11px]" data-step="3">3 完成</span>
  </div>

  <!-- 第 1 步：心愿 + 自动润色确认 -->
  <section id="gift-step1">
    <div class="card mt-6 p-5">
      <h2 class="display text-[15px]" style="color:var(--ember-soft)">想送 TA 什么？</h2>
      <textarea rows="3" id="gift-idea" maxlength="60"
        class="w-full bg-transparent outline-none resize-none text-[15px] mt-3 placeholder:text-[rgba(255,246,236,.35)]"
        style="color:var(--text)" placeholder="比如：TA 生前最爱喝的龙井茶……"></textarea>
      <p class="t3 text-[11px] text-right mt-1"><span id="gift-idea-count">0</span>/60</p>
    </div>

    <!-- 润色对比卡（自动出现） -->
    <div class="card mt-4 p-5" id="gift-polish-card" style="display:none">
      <p class="t3 text-[11px]" id="gift-polish-status">AI 正在润色你的描述……</p>
      <div id="gift-polish-body" style="display:none">
        <p class="t3 text-[12px]">你的心愿</p>
        <p class="text-[14px] mt-1 t2" id="gift-polish-origin"></p>
        <p class="t3 text-[12px] mt-4 mb-1">润色后的描述（可修改）</p>
        <textarea rows="3" id="gift-prompt" maxlength="100"
          class="w-full bg-transparent outline-none resize-none text-[14px] border-b border-white/10 pb-1"
          style="color:var(--text)"></textarea>
        <p class="t3 text-[11px] mt-2" id="gift-polish-remaining"></p>
      </div>
    </div>

    <button class="btn-primary mt-5" id="gift-next">下一步</button>
    <div class="grid grid-cols-2 gap-3 mt-3" id="gift-gen-btns" style="display:none">
      <button class="btn-primary" style="height:52px" id="gift-use-polished">用这个生成</button>
      <button class="btn-ghost" id="gift-use-origin">用原文生成</button>
    </div>
    <p class="t3 text-[11px] text-center mt-3">润色每日限 10 次 · 生成每月免费 3 次</p>
  </section>

  <!-- 第 2 步：生成（真实进度条） -->
  <section id="gift-step2" style="display:none">
    <p class="t2 text-[13px] mt-6 text-center" id="gift-status">正在为你准备……</p>
    <div class="mt-4 px-2" id="gift-progress-box">
      <div class="w-full h-2 rounded-full overflow-hidden" style="background:rgba(255,246,236,.08)">
        <div class="h-full rounded-full" id="gift-progress-bar"
          style="width:0%;background:linear-gradient(90deg,#ff7a2f,#ffb35c);transition:width .4s ease"></div>
      </div>
      <p class="t3 text-[11px] text-center mt-2"><span id="gift-progress-num">0</span>% · 一张一张慢慢画，好的东西值得等</p>
    </div>
    <div class="grid grid-cols-2 gap-3 mt-4" id="gift-candidates"></div>
    <button class="btn-ghost mt-5 w-full" id="gift-regen" style="display:none">不满意，重新生成</button>
  </section>

  <!-- 第 3 步：完成 -->
  <section id="gift-step3" style="display:none">
    <div class="card mt-6 overflow-hidden">
      <img id="gift-final-img" class="w-full h-64 object-cover" alt="选中的礼物"/>
      <div class="p-5">
        <input id="gift-name" type="text" maxlength="30"
          class="w-full bg-transparent outline-none display text-lg tracking-wider"
          style="color:var(--text)" placeholder="给这份礼物起个名字"/>
        <p class="t3 text-[11px] mt-2"><i class="fa-solid fa-circle-info mr-1"></i>收藏后需通过审核，之后出现在供桌</p>
      </div>
    </div>
    <div class="space-y-3 mt-6">
      <button class="btn-primary" id="gift-claim"><i class="fa-solid fa-box-archive"></i>收藏到纪念馆</button>
      <button class="btn-ghost w-full" id="gift-again"><i class="fa-solid fa-rotate-left text-[13px]"></i>再准备一件</button>
    </div>
  </section>
</div>
