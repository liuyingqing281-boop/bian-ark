<!-- V-FEEDBACK 帮助与反馈（R5） -->
<div class="navbar">
  <button class="nav-btn nav-back"><i class="fa-solid fa-chevron-left"></i></button>
  <span class="title">帮助与反馈</span>
  <span class="w-10"></span>
</div>
<div class="scroll pad pt-4 pb-8">
  <div class="card p-5">
    <h2 class="display text-[15px]" style="color:var(--ember-soft)">遇到问题，或想对我们说点什么？</h2>
    <textarea rows="5" id="fb-content" maxlength="500"
      class="w-full bg-transparent outline-none resize-none text-[15px] mt-4 placeholder:text-[rgba(255,246,236,.35)]"
      style="color:var(--text)" placeholder="写下你的问题或建议（500 字以内）……"></textarea>
    <p class="t3 text-[11px] text-right mt-1"><span id="fb-count">0</span>/500</p>
    <input id="fb-contact" type="text" maxlength="100"
      class="w-full bg-transparent outline-none text-[14px] mt-3 placeholder:text-[rgba(255,246,236,.35)]"
      style="color:var(--text)" placeholder="联系方式（选填，方便我们回复你）"/>
    <button class="btn-primary mt-5" id="fb-submit">提交反馈</button>
  </div>

  <h2 class="t3 text-[11px] tracking-[0.2em] mt-7 mb-3">常见问题</h2>
  <div class="card divide-y divide-white/5 text-[13px]">
    <p class="px-5 py-4 t2">怎么创建纪念馆？—— 登录后在首页点「创建纪念馆」，三步即可完成。</p>
    <p class="px-5 py-4 t2">怎么邀请亲友一起纪念？—— 在「亲友共同纪念」创建协作组，把邀请码发给亲友。</p>
    <p class="px-5 py-4 t2">纪念馆会被陌生人看到吗？—— 建馆时可选择私密或公开，随时可在馆设置中更改。</p>
  </div>
</div>
