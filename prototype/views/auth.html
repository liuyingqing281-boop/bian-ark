<!-- V0 登录注册屏（屏01 · 第一屏 · 登录/注册分离 2026-08-24 + 账号密码登录/忘记密码 2026-08-25）
     视觉：docs/前端具体设计流程.md §2.0「视觉规范」——概念光绸背景 × 深色半透明毛玻璃表单卡
     结构：tab → 方式/通道切换 → 输入组（含忘记密码链）→ 主 CTA → 微信次按钮 → 访客链 -->
<style>
  /* 光绸背景宿主：盖住 .view 的默认暗暖渐变；无 WebGL 时仅留静态渐变降级层 */
  .auth-silk { position: absolute; inset: 0; z-index: 0; background: #10141c; }
  .auth-silk-fallback {
    position: absolute; inset: 0;
    background:
      radial-gradient(120% 90% at 30% 20%, rgba(216, 169, 92, 0.28), transparent 55%),
      radial-gradient(100% 80% at 75% 80%, rgba(178, 60, 48, 0.20), transparent 60%),
      radial-gradient(140% 120% at 50% 50%, #1a2233 0%, #10141c 70%);
  }
  .auth-silk canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* 深色半透明毛玻璃表单卡（同 PC 登录页 .login-card），保证光绸背景上的对比度 */
  .auth-card {
    background: rgba(16, 20, 28, 0.55) !important;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(232, 226, 214, 0.14) !important;
    border-radius: 20px !important;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
  }

  /* 密码行：👁 显隐切换（密文=划斜线眼睛，明文=眼睛），纯前端态 */
  .auth-pw { position: relative; border-bottom: 1px solid var(--card-border); }
  .auth-eye {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 6px;
    color: rgba(232, 226, 214, 0.45); font-size: 15px; line-height: 1;
  }
  .auth-eye:hover { color: rgba(232, 226, 214, 0.8); }

  .auth-link { color: rgba(232, 226, 214, 0.5); text-decoration: none; font-size: 12px; }
  .auth-link:hover { color: rgba(232, 226, 214, 0.85); }

  /* 「换个意境」色板切换（同概念首页右下角胶囊按钮） */
  .auth-palette-btn {
    position: absolute; right: 16px; bottom: 88px; z-index: 2;
    font: inherit; font-size: 12px; letter-spacing: 0.05em;
    color: rgba(232, 226, 214, 0.6); background: none; cursor: pointer;
    border: 1px solid rgba(232, 226, 214, 0.22); border-radius: 999px;
    padding: 7px 18px;
    transition: border-color 0.3s ease, color 0.3s ease;
  }
  .auth-palette-btn:hover { border-color: rgba(216, 169, 92, 0.6); color: #d8a95c; }
</style>

<div class="auth-silk" id="auth-silk">
  <div class="auth-silk-fallback"></div>
</div>

<div class="scroll" style="display:flex;flex-direction:column;position:relative;z-index:1">
  <section class="pad flex flex-col items-center text-center" style="padding-top:96px">
    <h1 class="display" style="font-size:56px;letter-spacing:.22em;margin-right:-.22em;text-shadow:0 2px 40px rgba(0,0,0,.45)">彼岸</h1>
    <p class="mt-3" style="letter-spacing:.4em;margin-right:-.4em;color:rgba(232,226,214,.55)">思念有处安放</p>
  </section>

  <section class="pad mt-8" style="flex:1">
    <div class="card auth-card p-5">
      <!-- ============ 忘记密码浮层（三步，替换主表单；URL 不变） ============ -->
      <div id="auth-reset" style="display:none">
        <p class="text-center" style="font-size:15px;letter-spacing:.2em;color:var(--gold,#d8a95c)">找回密码</p>
        <button id="auth-reset-back" class="auth-link" style="margin-top:8px;padding:0">← 返回登录</button>

        <!-- 步骤① 账号 -->
        <div id="auth-reset-1">
          <p class="t3 text-[12px] mt-3">输入注册时的手机号或邮箱</p>
          <div class="mt-2" style="border-bottom:1px solid var(--card-border)">
            <input id="auth-reset-account" type="text" placeholder="手机号 / 邮箱"
              class="w-full bg-transparent outline-none text-[16px] py-3" style="color:var(--text)"/>
          </div>
          <p id="auth-reset-err" class="t3 text-[12px] mt-2" style="color:#d97b6c;display:none"></p>
          <button id="auth-reset-send" class="btn-primary mt-5" style="width:100%">发送验证码</button>
        </div>

        <!-- 步骤② 验证 + 新密码 -->
        <div id="auth-reset-2" style="display:none">
          <div class="mt-3" style="border-bottom:1px solid var(--card-border)">
            <input id="auth-reset-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码"
              class="w-full bg-transparent outline-none text-[16px] py-3" style="color:var(--text)"/>
          </div>
          <div class="auth-pw mt-2">
            <input id="auth-reset-new" type="password" maxlength="64" placeholder="新密码"
              class="w-full bg-transparent outline-none text-[16px] py-3 pr-9" style="color:var(--text)"/>
            <button class="auth-eye" data-eye="auth-reset-new"><i class="fa-regular fa-eye-slash"></i></button>
          </div>
          <div class="auth-pw mt-2">
            <input id="auth-reset-new2" type="password" maxlength="64" placeholder="确认新密码"
              class="w-full bg-transparent outline-none text-[16px] py-3 pr-9" style="color:var(--text)"/>
            <button class="auth-eye" data-eye="auth-reset-new2"><i class="fa-regular fa-eye-slash"></i></button>
          </div>
          <p class="t3 text-[11px] mt-2">8–64 位，需含大写/小写/数字/特殊符号中的至少 3 种</p>
          <p id="auth-reset-err2" class="t3 text-[12px] mt-2" style="color:#d97b6c;display:none"></p>
          <button id="auth-reset-submit" class="btn-primary mt-5" style="width:100%">重置密码</button>
        </div>

        <!-- 步骤③ 完成 -->
        <div id="auth-reset-3" style="display:none;text-align:center;padding:12px 0">
          <p style="color:#8fce9f;font-size:15px">✓ 密码已重置</p>
          <p class="t3 text-[12px] mt-1">请用新密码登录</p>
          <button id="auth-reset-done" class="btn-primary mt-5" style="width:100%">去登录</button>
        </div>
      </div>

      <!-- ============ 主表单 ============ -->
      <div id="auth-main">
        <!-- 登录/注册双 tab：默认「登录」，注册专门点击 -->
        <div class="flex gap-8" id="auth-tabs" style="border-bottom:1px solid var(--card-border)">
          <button class="auth-tab active" data-mode="login" style="padding:0 2px 12px;font-size:16px">登录</button>
          <button class="auth-tab" data-mode="register" style="padding:0 2px 12px;font-size:16px">注册</button>
        </div>

        <!-- 方式切换（仅登录 tab）：密码（默认）/ 验证码，两式平级 -->
        <div class="flex gap-6 mt-4" id="auth-methods" style="border-bottom:1px solid var(--card-border)">
          <button class="auth-m active" data-m="password" style="padding:0 2px 12px;font-size:15px">密码</button>
          <button class="auth-m" data-m="code" style="padding:0 2px 12px;font-size:15px">验证码</button>
        </div>

        <!-- 通道切换（注册 tab；登录·验证码方式）：手机/邮箱平级 -->
        <div class="flex gap-6 mt-4" id="auth-channels" style="border-bottom:1px solid var(--card-border)">
          <button class="auth-ch active" data-ch="sms" style="padding:0 2px 12px;font-size:15px">手机</button>
          <button class="auth-ch" data-ch="email" style="padding:0 2px 12px;font-size:15px">邮箱</button>
        </div>

        <!-- 账号输入：密码方式=手机/邮箱自动识别；验证码/注册=按通道 -->
        <div class="mt-4" style="border-bottom:1px solid var(--card-border)">
          <input id="auth-target" type="text" inputmode="tel" placeholder="手机号"
            class="w-full bg-transparent outline-none text-[16px] py-3"
            style="color:var(--text)"/>
        </div>

        <!-- 验证码 + 获取按钮（验证码方式 + 注册 tab） -->
        <div id="auth-code-row" class="flex items-center gap-3 mt-2" style="border-bottom:1px solid var(--card-border)">
          <input id="auth-code" type="text" inputmode="numeric" maxlength="6" placeholder="6 位验证码"
            class="flex-1 bg-transparent outline-none text-[16px] py-3"
            style="color:var(--text);min-width:0"/>
          <button id="auth-send" class="btn-ghost" style="height:38px;padding:0 16px;font-size:13px;white-space:nowrap">获取验证码</button>
        </div>

        <!-- 登录·密码方式：密码行 + 忘记密码链（右对齐紧贴密码行） -->
        <div id="auth-login-pass-row" class="auth-pw mt-2" style="display:none">
          <input id="auth-loginpass" type="password" maxlength="64" placeholder="密码"
            class="w-full bg-transparent outline-none text-[16px] py-3 pr-9" style="color:var(--text)"/>
          <button class="auth-eye" data-eye="auth-loginpass"><i class="fa-regular fa-eye-slash"></i></button>
        </div>
        <p id="auth-forgot-row" class="text-right mt-1" style="display:none">
          <a href="javascript:void 0" id="auth-forgot" class="auth-link">忘记密码？</a>
        </p>

        <!-- 注册 tab：密码 / 确认密码两行（插在验证码与昵称之间） -->
        <div id="auth-reg-pass-row" class="auth-pw mt-2" style="display:none">
          <input id="auth-pass" type="password" maxlength="64" placeholder="密码"
            class="w-full bg-transparent outline-none text-[16px] py-3 pr-9" style="color:var(--text)"/>
          <button class="auth-eye" data-eye="auth-pass"><i class="fa-regular fa-eye-slash"></i></button>
        </div>
        <div id="auth-reg-pass2-row" class="auth-pw mt-2" style="display:none">
          <input id="auth-pass2" type="password" maxlength="64" placeholder="确认密码"
            class="w-full bg-transparent outline-none text-[16px] py-3 pr-9" style="color:var(--text)"/>
          <button class="auth-eye" data-eye="auth-pass2"><i class="fa-regular fa-eye-slash"></i></button>
        </div>
        <p id="auth-rule-row" class="t3 text-[11px] mt-2" style="display:none">8–64 位，需含大写/小写/数字/特殊符号中的至少 3 种</p>

        <!-- 昵称（仅注册 tab） -->
        <div id="auth-name-row" class="mt-2" style="display:none;border-bottom:1px solid var(--card-border)">
          <input id="auth-name" type="text" maxlength="20" placeholder="怎么称呼你（选填）"
            class="w-full bg-transparent outline-none text-[16px] py-3" style="color:var(--text)"/>
        </div>

        <!-- 协议勾选（仅注册 tab，必勾） -->
        <label id="auth-agree-row" class="flex items-start gap-2 mt-4" style="display:none;cursor:pointer">
          <input id="auth-agree" type="checkbox" style="margin-top:3px;accent-color:#d8a95c"/>
          <span class="t3 text-[12px]" style="line-height:1.7">我已阅读并同意<a href="/zh/legal/terms" style="color:inherit;border-bottom:1px solid rgba(255,246,236,.2)">《用户协议》</a>与<a href="/zh/legal/privacy" style="color:inherit;border-bottom:1px solid rgba(255,246,236,.2)">《隐私政策》</a></span>
        </label>
      </div>
    </div>

    <button class="btn-primary mt-6" id="auth-submit">进入彼岸</button>
    <button class="btn-ghost mt-3" id="auth-wechat" style="height:48px">
      <i class="fa-brands fa-weixin mr-2"></i><span id="auth-wechat-text">微信扫码登录</span>
    </button>
    <p class="text-center mt-5">
      <a href="javascript:void 0" id="auth-guest" class="t3 text-[13px]" style="text-decoration:none;border-bottom:1px solid rgba(255,246,236,.2);padding-bottom:2px">先看看，不登录</a>
    </p>
  </section>

  <p class="t3 text-center text-[11px] px-8 pb-6" id="auth-footer" style="line-height:1.8">
    登录即表示同意<a href="/zh/legal/terms" style="color:inherit;border-bottom:1px solid rgba(255,246,236,.2)">《用户协议》</a>与<a href="/zh/legal/privacy" style="color:inherit;border-bottom:1px solid rgba(255,246,236,.2)">《隐私政策》</a>
  </p>
</div>

<button type="button" id="auth-palette" class="auth-palette-btn">换个意境</button>
