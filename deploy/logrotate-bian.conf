# 彼岸生产环境日志轮转（docs/16 P2-2）——由 deploy/setup-ops.sh 安装到 /etc/logrotate.d/bian
# /var/log/bian/out.log 与 error.log 由 PM2 持有文件句柄，必须用 copytruncate；
# backup.log 由每日 cron 追加，同样适用。
/var/log/bian/*.log {
  daily
  rotate 14
  compress
  delaycompress
  copytruncate
  missingok
  notifempty
  dateext
  su root root
}
